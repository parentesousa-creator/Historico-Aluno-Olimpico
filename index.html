<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Olimpíadas Científicas</title>
    <!-- Tailwind CSS para um design moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS para ler ficheiros Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-6">

    <div class="max-w-4xl mx-auto bg-white p-8 rounded-lg shadow-md">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Gestão de Olimpíadas Académicas</h1>

        <!-- Secção 1: Importar Planilha Excel -->
        <div class="mb-8 p-4 border border-blue-200 bg-blue-50 rounded-lg">
            <h2 class="text-xl font-semibold mb-2">1. Importar Alunos (Excel)</h2>
            <p class="text-sm text-gray-600 mb-4">A folha de cálculo deve conter as colunas: Nome, Turma, Serie, Idade.</p>
            <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700"/>
        </div>

        <!-- Secção 2: Adicionar Resultado Olímpico -->
        <div class="mb-8 p-4 border border-green-200 bg-green-50 rounded-lg">
            <h2 class="text-xl font-semibold mb-4">2. Registar Desempenho do Aluno</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Selecionar Aluno</label>
                    <select id="alunoSelect" class="w-full p-2 border rounded">
                        <option value="">Carregue o Excel primeiro...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Olimpíada (Ex: OBMEP, OBA, OBF)</label>
                    <input type="text" id="nomeOlimpiada" class="w-full p-2 border rounded" placeholder="Nome da Olimpíada">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Resultado / Fase</label>
                    <select id="resultadoSelect" class="w-full p-2 border rounded">
                        <option value="Premiado - Ouro">Premiado - Medalha de Ouro</option>
                        <option value="Premiado - Prata">Premiado - Medalha de Prata</option>
                        <option value="Premiado - Bronze">Premiado - Medalha de Bronze</option>
                        <option value="Premiado - Menção Honrosa">Premiado - Menção Honrosa</option>
                        <option value="Avançou de Fase">Avançou de Fase</option>
                        <option value="Apenas Participou">Apenas Participou</option>
                    </select>
                </div>
            </div>
            <button id="btnSalvar" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full transition">Guardar no Firebase</button>
            <p id="msgSucesso" class="text-green-700 text-sm mt-2 hidden text-center font-bold">Registo guardado com sucesso!</p>
        </div>

        <!-- Secção 3: Resumo Académico -->
        <div class="mb-8 p-4 border border-purple-200 bg-purple-50 rounded-lg">
            <h2 class="text-xl font-semibold mb-4">3. Resumo Académico</h2>
            <div class="flex gap-4 mb-4">
                <button id="btnResumo" class="bg-purple-600 text-white px-4 py-2 rounded hover:bg-purple-700 flex-1 transition">Ver Resumo Geral</button>
                <button id="btnHistorico" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 flex-1 transition">Ver Histórico Detalhado</button>
            </div>
            
            <!-- Área onde os resultados vão aparecer -->
            <div id="resultadoArea" class="bg-white p-4 border rounded shadow-inner min-h-[100px] hidden"></div>
        </div>
    </div>

    <!-- FIREBASE MODULES (Versão 10 Modular) -->
    <script type="module">
        // Importar as funções do Firebase através de CDNs
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // =====================================================================
        // PASSO IMPORTANTE: COLOQUE AS SUAS CHAVES DO FIREBASE AQUI
        // Substitua o objeto abaixo pelo 'firebaseConfig' que copiou do Firebase
        // =====================================================================
        const firebaseConfig = {
 		 apiKey: "AIzaSyBDA5CVPHeVBEb3KcaZH19Y7Pz7A-ghkWo",
  		authDomain: "resultados-alunos-olimpicos.firebaseapp.com",
  		projectId: "resultados-alunos-olimpicos",
  		storageBucket: "resultados-alunos-olimpicos.firebasestorage.app",
 		 messagingSenderId: "479169468642",
 		 appId: "1:479169468642:web:f034041d13e954ef70a6bb"
        };

        // Inicializar Firebase e Firestore
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lógica de Leitura do Excel
        let alunosData = [];
        document.getElementById('excelFile').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const data = new Uint8Array(event.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                // Converter Excel para JSON
                alunosData = XLSX.utils.sheet_to_json(worksheet);
                
                // Preencher a lista de seleção
                const select = document.getElementById('alunoSelect');
                select.innerHTML = '<option value="">Selecione o Aluno...</option>';
                
                alunosData.forEach(aluno => {
                    // Assume que a coluna se chama 'Nome' ou 'NOME'
                    const nome = aluno.Nome || aluno.NOME;
                    if(nome) {
                        const option = document.createElement('option');
                        option.value = nome;
                        option.textContent = `${nome} (Turma: ${aluno.Turma || '-'}, Série: ${aluno.Serie || '-'})`;
                        select.appendChild(option);
                    }
                });
                alert('Folha de cálculo carregada com sucesso!');
            };
            reader.readAsArrayBuffer(file);
        });

        // Lógica para Guardar no Firebase
        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const alunoNome = document.getElementById('alunoSelect').value;
            const olimpiada = document.getElementById('nomeOlimpiada').value;
            const resultado = document.getElementById('resultadoSelect').value;

            if (!alunoNome || !olimpiada) {
                alert("Por favor, selecione um aluno e introduza o nome da olimpíada.");
                return;
            }

            try {
                // Guardar documento na coleção 'registos_olimpiadas'
                await addDoc(collection(db, "registos_olimpiadas"), {
                    nomeAluno: alunoNome,
                    olimpiada: olimpiada,
                    resultado: resultado,
                    dataRegisto: new Date().toISOString()
                });
                
                const msg = document.getElementById('msgSucesso');
                msg.classList.remove('hidden');
                setTimeout(() => msg.classList.add('hidden'), 3000);
                document.getElementById('nomeOlimpiada').value = ''; // limpar campo
                
            } catch (e) {
                console.error("Erro ao adicionar documento: ", e);
                alert("Erro ao guardar no Firebase. Verifique a configuração e as regras da base de dados.");
            }
        });

        // Lógica para Ver o Resumo Académico
        document.getElementById('btnResumo').addEventListener('click', async () => {
            const alunoNome = document.getElementById('alunoSelect').value;
            if (!alunoNome) {
                alert("Selecione um aluno na secção 2 para ver o resumo.");
                return;
            }

            const q = query(collection(db, "registos_olimpiadas"), where("nomeAluno", "==", alunoNome));
            const querySnapshot = await getDocs(q);
            
            let totalParticipacoes = 0;
            let totalMedalhas = 0;

            querySnapshot.forEach((doc) => {
                totalParticipacoes++;
                if(doc.data().resultado.includes("Premiado")) {
                    totalMedalhas++;
                }
            });

            const area = document.getElementById('resultadoArea');
            area.classList.remove('hidden');
            area.innerHTML = `
                <h3 class="font-bold text-lg text-purple-700">Resumo de ${alunoNome}</h3>
                <p class="mt-2"><strong>Total de Olimpíadas:</strong> ${totalParticipacoes}</p>
                <p><strong>Total de Premiações (Medalhas/Menções):</strong> ${totalMedalhas}</p>
            `;
        });

        // Lógica para Ver o Histórico Detalhado
        document.getElementById('btnHistorico').addEventListener('click', async () => {
            const alunoNome = document.getElementById('alunoSelect').value;
            if (!alunoNome) {
                alert("Selecione um aluno na secção 2 para ver o histórico.");
                return;
            }

            const q = query(collection(db, "registos_olimpiadas"), where("nomeAluno", "==", alunoNome));
            const querySnapshot = await getDocs(q);
            
            let premiados = [];
            let fases = [];
            let participacoes = [];

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                if(data.resultado.includes("Premiado")) premiados.push(`${data.olimpiada} (${data.resultado})`);
                else if(data.resultado === "Avançou de Fase") fases.push(data.olimpiada);
                else participacoes.push(data.olimpiada);
            });

            const area = document.getElementById('resultadoArea');
            area.classList.remove('hidden');
            
            // Construir o HTML do Histórico
            let html = `<h3 class="font-bold text-lg text-indigo-700 mb-3">Histórico Detalhado: ${alunoNome}</h3>`;
            
            html += `<div class="mb-2"><strong class="text-yellow-600">🏆 Premiado:</strong>`;
            if (premiados.length > 0) html += `<ul class="list-disc ml-6">` + premiados.map(p => `<li>${p}</li>`).join('') + `</ul>`;
            else html += ` <span class="text-gray-500">Nenhum registo.</span>`;
            html += `</div>`;

            html += `<div class="mb-2"><strong class="text-blue-600">🚀 Avançou de Fase:</strong>`;
            if (fases.length > 0) html += `<ul class="list-disc ml-6">` + fases.map(p => `<li>${p}</li>`).join('') + `</ul>`;
            else html += ` <span class="text-gray-500">Nenhum registo.</span>`;
            html += `</div>`;

            html += `<div><strong class="text-gray-600">📝 Apenas Participou:</strong>`;
            if (participacoes.length > 0) html += `<ul class="list-disc ml-6">` + participacoes.map(p => `<li>${p}</li>`).join('') + `</ul>`;
            else html += ` <span class="text-gray-500">Nenhum registo.</span>`;
            html += `</div>`;

            area.innerHTML = html;
        });
    </script>
</body>
</html>
